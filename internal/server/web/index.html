<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gpukoll</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><rect x="6" y="9" width="5" height="6" rx="1"/><rect x="13" y="9" width="5" height="6" rx="1"/><path d="M7 18v2M12 18v2M17 18v2"/></svg>
      <span>gpukoll</span>
    </div>
    <div class="topbar-right">
      <span id="updated" class="muted" aria-live="polite"></span>
      <span class="guest" title="Anonymous access, read-only">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        Guest
      </span>
      <button id="theme" class="icon-btn" type="button" aria-label="Theme"></button>
    </div>
  </header>

  <main>
    <div id="error" class="banner" hidden></div>

    <section class="stats" aria-label="Summary">
      <div class="stat">
        <div class="stat-label"><i class="dot free"></i>Available</div>
        <div class="stat-value" id="s-available">–</div>
        <div class="stat-sub muted">GPUs free on online servers</div>
      </div>
      <div class="stat">
        <div class="stat-label"><i class="dot used"></i>In use</div>
        <div class="stat-value" id="s-used">–</div>
        <div class="stat-sub muted" id="s-used-sub">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total GPUs</div>
        <div class="stat-value" id="s-total">–</div>
        <div class="stat-sub muted" id="s-total-sub">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Servers online</div>
        <div class="stat-value" id="s-servers">–</div>
        <div class="stat-sub muted" id="s-servers-sub">&nbsp;</div>
      </div>
    </section>

    <div class="usage" id="usage" aria-hidden="true"></div>

    <div class="legend" aria-label="Legend">
      <span><i class="swatch free"></i>Available</span>
      <span><i class="swatch used"></i>In use</span>
      <span><i class="swatch off"></i>Server offline</span>
      <span class="muted">Block size = GPU memory</span>
    </div>

    <section id="servers" class="servers" aria-label="GPU servers"></section>
  </main>

  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
