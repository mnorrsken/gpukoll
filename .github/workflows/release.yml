name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gpukoll
  CHART: charts/gpukoll

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint ${{ env.CHART }}

      - name: Check CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          grep -qx "## ${VERSION}" CHANGELOG.md || { echo "No CHANGELOG section for ${VERSION}" >&2; exit 1; }

  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  chart:
    name: Package and publish chart
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set chart version from tag
        run: |
          TAG_NO_V="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version:.*/version: ${TAG_NO_V}/" ${{ env.CHART }}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG_NO_V}\"/" ${{ env.CHART }}/Chart.yaml

      - name: Lint and package chart
        run: |
          helm lint ${{ env.CHART }}
          helm package ${{ env.CHART }} -d .helm-packages

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI registry
        run: helm push .helm-packages/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          helm install gpukoll oci://ghcr.io/${{ github.repository_owner }}/charts/gpukoll --version ${VERSION_NO_V} \\
            --namespace gpukoll --create-namespace
          \`\`\`

          Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_NO_V}\`
          Chart: \`helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/gpukoll --version ${VERSION_NO_V}\`
          NOTES

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Release ${GITHUB_REF_NAME}" --notes-file notes.md
