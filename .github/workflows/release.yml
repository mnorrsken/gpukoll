name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gpukoll
  CHART: charts/gpukoll

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint ${{ env.CHART }}

      - name: Check CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          grep -qx "## ${VERSION}" CHANGELOG.md || { echo "No CHANGELOG section for ${VERSION}" >&2; exit 1; }

  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  chart:
    name: Package and publish chart
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set chart version from tag
        run: |
          TAG_NO_V="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version:.*/version: ${TAG_NO_V}/" ${{ env.CHART }}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG_NO_V}\"/" ${{ env.CHART }}/Chart.yaml

      - name: Lint and package chart
        run: |
          helm lint ${{ env.CHART }}
          helm package ${{ env.CHART }} -d .helm-packages

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push chart to GHCR OCI registry
        run: helm push .helm-packages/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          helm install gpukoll oci://ghcr.io/${{ github.repository_owner }}/charts/gpukoll --version ${VERSION_NO_V} \\
            --namespace gpukoll --create-namespace
          \`\`\`

          Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_NO_V}\`
          Chart: \`helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/gpukoll --version ${VERSION_NO_V}\`
          NOTES

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Release ${GITHUB_REF_NAME}" --notes-file notes.md
