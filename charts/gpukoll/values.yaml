replicaCount: 1

image:
  repository: ghcr.io/mnorrsken/gpukoll
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Generated from the fullname when empty.
  name: ""

# A ClusterRole to list nodes (GPU Feature Discovery labels, Ready state)
# and a Role in dcgm.namespace to list the DCGM exporter's EndpointSlices.
rbac:
  create: true

podAnnotations: {}
podLabels: {}

# No runAsUser/fsGroup, so OpenShift's restricted-v2 SCC can pick the UID.
# The image runs as UID 65532 when nothing assigns one.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gpukoll.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: gpukoll-tls
  #    hosts:
  #      - gpukoll.example.com

# OpenShift Route. Only rendered when the cluster serves route.openshift.io/v1.
route:
  enabled: true
  # Empty lets OpenShift generate <name>-<namespace>.<apps domain>.
  host: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

config:
  # How often to list nodes and scrape the DCGM exporters.
  interval: 10s

# NVIDIA DCGM exporter, deployed by the GPU Operator. It must run with
# DCGM_EXPORTER_KUBERNETES=true (the GPU Operator default) so GPUs in use
# carry a pod label. gpukoll connects to the exporter pods on their pod IPs;
# a NetworkPolicy in this namespace must allow that.
dcgm:
  # nvidia-gpu-operator on OpenShift, gpu-operator for the upstream chart.
  namespace: nvidia-gpu-operator
  service: nvidia-dcgm-exporter

# A NetworkPolicy in dcgm.namespace that lets gpukoll reach the exporter.
# Only enable it when that namespace already has NetworkPolicies selecting
# the exporter pods. A policy isolates every pod it selects, so in an open
# namespace this would block other scrapers such as Prometheus.
networkPolicy:
  enabled: false
  exporterPodLabels:
    app: nvidia-dcgm-exporter
  exporterPort: 9400
