{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpukoll.fullname" . }}
  labels:
    {{- include "gpukoll.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpukoll.fullname" . }}
  labels:
    {{- include "gpukoll.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpukoll.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpukoll.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
